version: '3'

tasks:
  keys:
    status: [test -f keys/melange.rsa]
    cmds:
      - mkdir -p keys
      - |
        podman run --rm --privileged \
          -v "$PWD":/work:Z -w /work \
          --entrypoint melange ghcr.io/wolfi-dev/sdk \
          keygen keys/melange.rsa

  packages:
    deps: [keys]
    cmds:
      - |
        set -e
        mkdir -p packages
        # wolfictl derives the dependency order; melange builds each recipe.
        order=$(podman run --rm \
          -v "$PWD":/work:Z -w /work \
          --entrypoint wolfictl ghcr.io/wolfi-dev/sdk \
          text --dir melange --type name)
        for p in $order; do
          podman run --rm --privileged \
            -v "$PWD":/work:Z -w /work \
            --entrypoint melange ghcr.io/wolfi-dev/sdk \
            build "melange/$p.yaml" \
              --arch amd64 \
              --signing-key keys/melange.rsa \
              --keyring-append keys/melange.rsa.pub \
              --repository-append packages \
              --out-dir packages
        done

  image:
    deps: [packages]
    cmds:
      - |
        podman run --rm --privileged \
          -v "$PWD":/work:Z -w /work \
          --entrypoint apko ghcr.io/wolfi-dev/sdk \
          build apko/wayfire-dev.yaml \
            ghcr.io/unity-shell/ci/wayfire:v0.11.0 \
            wayfire-dev.tar \
            --arch amd64 \
            --keyring-append keys/melange.rsa.pub \
            --repository-append packages
      - 'echo "load with: podman load < wayfire-dev.tar"'

  push:
    deps: [packages]
    cmds:
      - |
        podman run --rm --privileged \
          -v "$PWD":/work:Z -w /work \
          --entrypoint apko ghcr.io/wolfi-dev/sdk \
          publish apko/wayfire-dev.yaml \
            ghcr.io/unity-shell/ci/wayfire:v0.11.0 \
            --arch amd64 \
            --keyring-append keys/melange.rsa.pub \
            --repository-append packages

  clean:
    cmds:
      - rm -rf packages wayfire-dev.tar
