package:
  name: wlroots
  version: 0.20.2
  epoch: 0
  description: Modular Wayland compositor library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libdrm
      - libinput
      - libxkbcommon
      - mesa-egl
      - mesa-gbm
      - mesa-gles
      - pixman
      - wayland
      - libudev
      - hwdata-pnp
      - libdisplay-info # melange
      - libliftoff # melange
      - seatd # melange

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - meson
      - ninja-build
      - pkgconf
      - wayland-dev
      - wayland-protocols-dev
      - libdrm-dev
      - libinput-dev
      - libxkbcommon-dev
      - mesa-dev
      - mesa-gbm       # provides the libgbm.so link used by -lgbm
      - pixman-dev
      - systemd-dev
      - hwdata-dev
      - hwdata-pnp
      - libdisplay-info-dev # melange
      - libliftoff-dev # melange
      - seatd-dev # melange

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/wlroots/wlroots.git
      tag: 0.20.2
      depth: 1

  - uses: meson/configure
    with:
      # Lean build sufficient for compiling/linking Wayfire and plugins: no
      # X11 backend (avoids xcb), GLES2 renderer only (no Vulkan), no examples.
      opts: |
        -Dbuildtype=debugoptimized \
        -Dexamples=false \
        -Dxwayland=disabled \
        -Dbackends=drm,libinput \
        -Drenderers=gles2

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: wlroots-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - wlroots # melange
        - wayland-dev
        - wayland-protocols-dev
        - libdrm-dev
        - libinput-dev
        - libxkbcommon-dev
        - mesa-dev
        - pixman-dev
        - libdisplay-info-dev # melange
        - libliftoff-dev # melange
        - seatd-dev # melange

update:
  enabled: false
