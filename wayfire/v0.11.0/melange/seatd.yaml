package:
  name: seatd
  version: 0.9.3
  epoch: 0
  description: Minimal seat management daemon and library (libseat)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libsystemd

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - meson
      - ninja-build
      - pkgconf
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kennylevinsen/seatd.git
      branch: master
      depth: 1

  - uses: meson/configure
    with:
      opts: |
        -Dwerror=false \
        -Dlibseat-logind=systemd \
        -Dlibseat-seatd=enabled \
        -Dlibseat-builtin=enabled \
        -Dserver=enabled \
        -Dman-pages=disabled \
        -Dexamples=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: seatd-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - seatd # melange

update:
  enabled: false
