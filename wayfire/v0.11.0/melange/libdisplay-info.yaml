package:
  name: libdisplay-info
  version: 0.4.0
  epoch: 0
  description: EDID and DisplayID library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - hwdata-pnp

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - hwdata-dev
      - hwdata-pnp
      - meson
      - ninja-build
      - pkgconf
      - python-3.13

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/emersion/libdisplay-info.git
      branch: main
      depth: 1

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libdisplay-info-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libdisplay-info # melange

update:
  enabled: false
