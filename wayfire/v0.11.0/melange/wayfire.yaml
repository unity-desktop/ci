package:
  name: wayfire
  version: 0.11.0
  epoch: 0
  description: 3D wlroots-based Wayland compositor
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - cairo
      - libdrm
      - libevdev
      - libinput
      - libsystemd
      - libudev
      - libxkbcommon
      - mesa
      - mesa-egl
      - mesa-gbm
      - pango
      - pixman
      - wayland
      - wlroots # melange
      - libdisplay-info # melange
      - libliftoff # melange
      - seatd # melange
      - wf-config # melange
      - yyjson # melange

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - cmake
      - git
      - hwdata-dev
      - hwdata-pnp
      - lcms2-dev
      - libdrm-dev
      - libevdev-dev
      - libinput-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libxcb-dev
      - libxkbcommon-dev
      - libxml2-dev
      - mesa-dev
      - mesa-gbm
      - meson
      - ninja-build
      - pixman-dev
      - pkgconf
      - systemd-dev
      - wayland-dev
      - wayland-protocols-dev
      - glm-dev # melange
      - libdisplay-info-dev # melange
      - libliftoff-dev # melange
      - pango-dev
      - seatd-dev # melange
      - wf-config-dev # melange
      - wlroots-dev # melange
      - yyjson-dev # melange

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/WayfireWM/wayfire.git
      tag: v0.11.0
      depth: 1
      recurse-submodules: true
      shallow-submodules: true

  - uses: meson/configure
    with:
      opts: |
        -Dbuildtype=debugoptimized \
        -Duse_system_wlroots=enabled \
        -Duse_system_wfconfig=enabled \
        -Dxwayland=disabled \
        -Dvulkan_effects=false \
        -Dtests=disabled \
        -Dbuild_locales=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: wayfire-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - wayfire # melange
        - wf-config-dev # melange
        - wlroots-dev # melange
        - libdrm-dev
        - libinput-dev
        - libxkbcommon-dev
        - mesa-dev
        - pixman-dev
        - wayland-dev

update:
  enabled: false
