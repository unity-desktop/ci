package:
  name: libliftoff
  version: 0.6.0
  epoch: 0
  description: KMS plane composition library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libdrm

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libdrm-dev
      - meson
      - ninja-build
      - pkgconf

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/emersion/libliftoff.git
      branch: master
      depth: 1

  - uses: meson/configure
    with:
      opts: |
        -Dwerror=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libliftoff-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libliftoff # melange
        - libdrm-dev

update:
  enabled: false
