name: Build and publish Wayfire image

on:
  push:
    branches: [main]
    paths:
      - 'wayfire/v0.11.0/**'
      - '.github/workflows/wayfire-image.yml'
  workflow_dispatch:

env:
  DIR: wayfire/v0.11.0
  IMAGE: ghcr.io/unity-shell/ci/wayfire:v0.11.0

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfi-dev/sdk
      options: --privileged
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3

      - name: Generate signing key
        working-directory: ${{ env.DIR }}
        run: |
          mkdir -p keys
          melange keygen keys/melange.rsa

      - name: Resolve build order
        id: order
        working-directory: ${{ env.DIR }}
        run: |
          configs=$(wolfictl text --dir melange --type name \
            | sed 's#.*#melange/&.yaml#' | paste -sd,)
          echo "configs=$configs" >> "$GITHUB_OUTPUT"
          echo "order: $configs"

      - name: Build packages
        working-directory: ${{ env.DIR }}
        run: |
          set -e
          mkdir -p packages
          for c in $(echo "${{ steps.order.outputs.configs }}" | tr ',' ' '); do
            melange build "$c" \
              --arch amd64 \
              --signing-key keys/melange.rsa \
              --keyring-append keys/melange.rsa.pub \
              --repository-append packages \
              --out-dir packages
          done

      - name: Publish image
        working-directory: ${{ env.DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          apko login ghcr.io -u "$GH_ACTOR" -p "$GH_TOKEN"
          apko publish apko/wayfire-dev.yaml "$IMAGE" \
            --keyring-append keys/melange.rsa.pub \
            --repository-append packages
