package:
  name: gtk4-layer-shell
  version: 1.3.0
  epoch: 0
  description: Library to create panels and desktop components with GTK4 on Wayland
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - gtk-4
      - wayland

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - gtk-4-dev
      - meson
      - ninja-build
      - pkgconf
      - vala
      - wayland-dev
      - wayland-protocols-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wmww/gtk4-layer-shell.git
      branch: main
      depth: 1

  - uses: meson/configure
    with:
      opts: |
        -Dbuildtype=debugoptimized \
        -Dexamples=false \
        -Ddocs=false \
        -Dtests=false \
        -Dsmoke-tests=false \
        -Dintrospection=true \
        -Dvapi=true

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: gtk4-layer-shell-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - gtk4-layer-shell # melange
        - gtk-4-dev
        - wayland-dev

update:
  enabled: false
