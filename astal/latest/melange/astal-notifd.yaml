package:
  name: astal-notifd
  version: 0.1.0
  epoch: 0
  description: Notification daemon
  copyright:
    - license: LGPL-2.1-only
  dependencies:
    runtime:
      - glib
      - gdk-pixbuf
      - json-glib # melange
      - quarrel # melange

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - meson
      - ninja-build
      - pkgconf
      - python-3.13
      - vala
      - gdk-pixbuf-dev
      - json-glib-dev # melange
      - quarrel-dev # melange

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aylur/astal.git
      branch: main
      depth: 1

  # Every Astal library is its own meson project inside the monorepo.
  - working-directory: lib/notifd
    pipeline:
      - uses: meson/configure
        with:
          opts: |
            -Dbuildtype=debugoptimized

      - uses: meson/compile

      - uses: meson/install

  - uses: strip

  # meson skips gnome.post_install when DESTDIR is set, so compile the
  # settings schema into the package by hand.
  - runs: |
      glib-compile-schemas "${{targets.contextdir}}/usr/share/glib-2.0/schemas"

subpackages:
  - name: astal-notifd-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - astal-notifd # melange
        - glib-dev
        - gdk-pixbuf-dev
        - json-glib-dev # melange
        - quarrel-dev # melange

update:
  enabled: false
