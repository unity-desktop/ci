package:
  name: wireplumber
  version: 0.5.17
  epoch: 0
  description: Modular session and policy manager for PipeWire
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - glib
      - libsystemd
      - lua5.4-libs
      - pipewire

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # -Dintrospection=enabled makes upstream require doxygen and python lxml
      - doxygen
      - gettext-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - lua5.4-dev
      - meson
      - ninja-build
      - pipewire-dev
      - pkgconf
      - py3.13-lxml
      - python-3.13
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/pipewire/wireplumber.git
      branch: master
      depth: 1

  - uses: meson/configure
    with:
      opts: |
        --sysconfdir=/etc \
        -Dbuildtype=debugoptimized \
        -Dintrospection=enabled \
        -Ddoc=disabled \
        -Dsystem-lua=true \
        -Dsystem-lua-version=5.4 \
        -Delogind=disabled \
        -Dsystemd=enabled \
        -Dsystemd-system-service=false \
        -Dsystemd-user-service=true \
        -Dtests=false \
        -Ddbus-tests=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: wireplumber-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - wireplumber # melange
        - glib-dev
        - pipewire-dev

update:
  enabled: false
