package:
  name: astal-gtk4
  version: 4.0.0
  epoch: 0
  description: Astal GTK4 widget library
  copyright:
    - license: LGPL-2.1-only
  dependencies:
    runtime:
      - glib
      - gtk-4
      - gtk4-layer-shell # melange
      - astal-io # melange

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - meson
      - ninja-build
      - pkgconf
      - python-3.13
      - vala
      - gtk-4-dev
      - wayland-dev
      - wayland-protocols-dev
      - astal-io-dev # melange
      - gtk4-layer-shell-dev # melange

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aylur/astal.git
      branch: main
      depth: 1

  # Every Astal library is its own meson project inside the monorepo.
  - working-directory: lib/astal/gtk4
    pipeline:
      - uses: meson/configure
        with:
          opts: |
            -Dbuildtype=debugoptimized

      - uses: meson/compile

      - uses: meson/install

  - uses: strip

subpackages:
  - name: astal-gtk4-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - astal-gtk4 # melange
        - glib-dev
        - gtk-4-dev
        - wayland-dev
        - wayland-protocols-dev
        - astal-io-dev # melange
        - gtk4-layer-shell-dev # melange

update:
  enabled: false
