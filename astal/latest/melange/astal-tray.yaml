package:
  name: astal-tray
  version: 0.1.0
  epoch: 0
  description: StatusNotifierItem implementation
  copyright:
    - license: LGPL-2.1-only
  dependencies:
    runtime:
      - glib
      - gdk-pixbuf
      - appmenu-glib-translator # melange
      - json-glib # melange

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - meson
      - ninja-build
      - pkgconf
      - python-3.13
      - vala
      - gdk-pixbuf-dev
      - appmenu-glib-translator-dev # melange
      - json-glib-dev # melange

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aylur/astal.git
      branch: main
      depth: 1

  # Every Astal library is its own meson project inside the monorepo.
  - working-directory: lib/tray
    pipeline:
      - uses: meson/configure
        with:
          opts: |
            -Dbuildtype=debugoptimized

      - uses: meson/compile

      - uses: meson/install

  - uses: strip

subpackages:
  - name: astal-tray-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - astal-tray # melange
        - glib-dev
        - gdk-pixbuf-dev
        - appmenu-glib-translator-dev # melange
        - json-glib-dev # melange

update:
  enabled: false
